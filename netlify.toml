# Netlify settings for the website (frontend/). Netlify reads this file
# automatically when you connect the repo, so the build fields can stay empty.
#
# One setting must be added in Netlify itself:
#   Site configuration -> Environment variables -> VITE_API_URL
#   = the backend's Render address, e.g. https://rehabvision-api.onrender.com
# Redeploy after changing it (it's built into the website).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# The site has its own pages (/login, /reset-password, ...) that only exist
# inside the app. Serve index.html for every path so opening or refreshing
# one of those links works instead of showing "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
